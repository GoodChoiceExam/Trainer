name: CI/CD

# Bygger og tester på alle branches. Publish sker kun på master.
on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FitLife.Trainer.slnx

      - name: Build
        run: dotnet build FitLife.Trainer.slnx --no-restore

      - name: Test
        run: dotnet test FitLife.Trainer.Tests/FitLife.Trainer.Tests.csproj --no-restore --no-build

  publish:
    name: Push to DockerHub
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      # Læser InformationalVersion fra .csproj og splitter op i full, minor og major
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<InformationalVersion>)[^<]+' FitLife.Trainer.Api/FitLife.Trainer.Api.csproj)
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fitlife-trainer
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FitLife.Trainer.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Trigge Infrastructure-repoets deploy-workflow via DEPLOY_PAT så serveren henter det nye image
      - name: Trigger Infrastructure deploy
        run: |
          gh workflow run deploy.yml \
            --repo GoodChoiceExam/Infrastructure \
            --ref master
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
